<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Inner Shield / Vault Contour -->
  <path d="M32 10 L48 16 V28 C48 39.5 41.2 49 32 53 C22.8 49 16 39.5 16 28 V16 Z" 
        fill="#047857" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Outer Vault Dial Arc -->
  <circle cx="32" cy="32" r="16" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Dynamic VaultFlow "V" & Currency Flow -->
  <path d="M22 23 L32 40 L42 23" 
        stroke="url(#emeraldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Flow upward pulse / Currency coin core -->
  <circle cx="32" cy="27" r="4" fill="url(#accentGrad)" />
  
  <!-- Growth Accent Spark -->
  <path d="M43 15 L45 19 L49 21 L45 23 L43 27 L41 23 L37 21 L41 19 Z" fill="#38bdf8" />
</svg>
