<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="masterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="emeraldStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="masterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#masterBg)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Ambient Center Halo Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#halo)" />

  <!-- Protective Vault Shield Contour -->
  <path d="M256 80 L384 128 V224 C384 316 330 392 256 424 C182 392 128 316 128 224 V128 Z" 
        fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.4" stroke-width="8" stroke-linejoin="round" />

  <!-- Vault Mechanism Dial Arc -->
  <circle cx="256" cy="256" r="128" stroke="#334155" stroke-width="12" stroke-dasharray="24 16" stroke-linecap="round" />
  <circle cx="256" cy="256" r="100" stroke="#1e293b" stroke-width="4" />

  <!-- Bold Flowing "V" -->
  <path d="M176 184 L256 320 L336 184" 
        stroke="url(#emeraldStream)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#masterGlow)" />
  
  <!-- Flow Horizon / Core Coin Node -->
  <circle cx="256" cy="216" r="32" fill="url(#cyanSpark)" />
  <circle cx="256" cy="216" r="16" fill="#ffffff" fill-opacity="0.9" />

  <!-- Financial Ascending Spark -->
  <path d="M344 120 L360 152 L392 168 L360 184 L344 216 L328 184 L296 168 L328 152 Z" 
        fill="#38bdf8" filter="url(#masterGlow)" />
</svg>
